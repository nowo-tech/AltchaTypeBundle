services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Nowo\AltchaTypeBundle\Twig\NowoAltchaTypeTwigExtension: ~

  Nowo\AltchaTypeBundle\Profile\AltchaTypeProfileRegistry:
    arguments:
      $defaultProfile: '%nowo_altcha_type.default_profile%'
      $profiles: '%nowo_altcha_type.profiles%'

  Nowo\AltchaTypeBundle\Service\AltchaClientFactory:
    arguments:
      $hmacSignature: '%nowo_altcha_type.hmac_signature%'
      $hmacKeySignature: '%nowo_altcha_type.hmac_key_signature%'
      $hmacAlgorithm: '%nowo_altcha_type.hmac_algorithm%'

  Nowo\AltchaTypeBundle\Service\AltchaChallengeFactory: ~

  # $replayCache / $lockFactory are set by AltchaTypeExtension from replay_protection.*.
  Nowo\AltchaTypeBundle\Service\AltchaVerifier:
    arguments:
      $enable: '%nowo_altcha_type.enable%'
      $sentinel: '%nowo_altcha_type.sentinel%'
      $replayCache: null
      $sentinelHttpClient: null
      $lockFactory: null

  # REQ-SF-004 rule 7: not autoconfigured. On Symfony >= 7.3 autoconfiguration tags a #[Route] class
  # `routing.controller`, and the host's `controllers: { resource: routing.controllers }` would then expose the
  # challenge endpoint without the host importing the bundle routes (opt-in only). Tagged explicitly instead.
  Nowo\AltchaTypeBundle\Controller\AltchaChallengeController:
    autoconfigure: false
    tags: [controller.service_arguments]

  Nowo\AltchaTypeBundle\Form\Type\AltchaType:
    arguments:
      $enable: '%nowo_altcha_type.enable%'
      $includeScript: '%nowo_altcha_type.include_script%'
      $useStimulus: '%nowo_altcha_type.use_stimulus%'
      $debug: '%nowo_altcha_type.debug%'

  Nowo\AltchaTypeBundle\Validator\Constraints\AltchaValidValidator: ~
